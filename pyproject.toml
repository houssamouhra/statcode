[project]
name = "statcode"
version = "2.1.0"
description = "Man pages for HTTP status codes"
readme = "README.md"
requires-python = ">=3.6"
license = "MIT"
authors = [
    { name = "shobrook", email = "shobrookj@gmail.com" },
    { name = "Houssam Ouhra", email = "contact@houssam.io" }
]
keywords = ["http", "status-codes", "cli", "man-page"]
dependencies = [
    "argparse>=1.4.0",
    "pyyaml>=6.0",
    "urwid>=2.1",
]

[project.urls]
Repository = "https://github.com/houssamouhra/statcode"

[project.scripts]
statcode = "statcode.statcode:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statcode"]

# Include the YAML data files
[tool.hatch.build.targets.wheel.force-include]
"src/statcode/code_descriptions.yml"     = "statcode/code_descriptions.yml"
"src/statcode/header_descriptions.yml"   = "statcode/header_descriptions.yml"
"src/statcode/copyright_description.yml" = "statcode/copyright_description.yml"

[dependency-groups]
dev = [
    "ruff>=0.0.17",
]
